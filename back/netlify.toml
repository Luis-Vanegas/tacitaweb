# Backend NestJS como función serverless (ver netlify/functions/api.ts).
# Site de Netlify configurado con "Base directory" = back/.
[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  # Netlify usa esbuild igual para funciones .ts sin importar node_bundler
  # (zisi no transpila TypeScript), así que la única forma de evitar sus dos
  # problemas reales es marcar external_node_modules en vez de sacar esbuild:
  # - @nestjs/websockets y @nestjs/microservices: requires dinámicos y
  #   opcionales de @nestjs/core (no estan instalados, rompian el build con
  #   "Could not resolve").
  # - @nestjs/mapped-types: usa createRequire(__filename) para resolver
  #   rutas relativas; si esbuild lo inlinea en el bundle, __filename ya no
  #   apunta a su ubicación real y rompe en runtime (error real:
  #   "TypeError: filename must be..."). External hace que Netlify copie el
  #   paquete real en vez de reempaquetarlo.
  node_bundler = "esbuild"
  external_node_modules = ["@nestjs/websockets", "@nestjs/microservices", "@nestjs/mapped-types"]

[[redirects]]
  force = true
  from = "/api/*"
  status = 200
  to = "/.netlify/functions/api/:splat"
