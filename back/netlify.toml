# Backend NestJS como función serverless (ver netlify/functions/api.ts).
# Site de Netlify configurado con "Base directory" = back/.
[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  # SIN node_bundler = "esbuild" a propósito: Nest/TypeORM usan requires
  # dinámicos y trucos de Node (createRequire con __filename, reflection) que
  # se rompen cuando esbuild concatena todo en un solo archivo (error real:
  # "@nestjs/mapped-types" fallaba en runtime con esbuild). El default
  # "zisi" copia node_modules real en vez de reempaquetar, y no tiene ese
  # problema — bundle más pesado, pero es el que efectivamente funciona.

[[redirects]]
  force = true
  from = "/api/*"
  status = 200
  to = "/.netlify/functions/api/:splat"
