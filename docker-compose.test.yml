services:
  postgres-test:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: tacitaweb_test
    ports:
      - '5433:5432'
    volumes:
      - postgres-test-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U test -d tacitaweb_test']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-test-data:
